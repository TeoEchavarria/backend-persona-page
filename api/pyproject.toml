[project]
name = "portfolio-search-api"
version = "0.1.0"
description = "Búsqueda semántica sobre las notas del portafolio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "markdown-it-py>=3.0",
    "numpy>=2.0",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Solo para indexar y desarrollar en local: el despliegue en Vercel calcula
# los embeddings de las consultas por HTTP y no puede cargar torch.
local = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = ["pytest>=8.3", "uvicorn[standard]>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
